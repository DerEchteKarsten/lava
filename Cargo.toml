[workspace]
resolver = "3"
members = ["lava", "lava-build-slang", "lava-macros", "lava-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = { version = "0.32", features = ["bytemuck", "mint"] }
# lava's forks (github.com/DerEchteKarsten/{ash,gpu-allocator,slang-rs}, branch `lava`), checked
# out beside this repository; see CLAUDE.md.
ash = { package = "lava-ash", version = "0.38.0", path = "../forks/ash/ash" }
ash-window = { package = "lava-ash-window", version = "0.13.0", path = "../forks/ash/ash-window" }
gpu-allocator = { package = "lava-gpu-allocator", version = "0.28", path = "../forks/gpu-allocator", default-features = false, features = ["vulkan", "std"] }
shader-slang = { package = "lava-slang", version = "0.1.0", path = "../forks/slang-rs" }
raw-window-handle = "0.6.2"
smallvec = { version = "1.15.1", features = ["union", "const_generics"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
notify = "8.2.0"
png = "0.18"

