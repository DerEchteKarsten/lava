[package]
name = "lava-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
lava = { path = "../lava", default-features = false }
glam = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
winit = "0.30"
raw-window-handle = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
png = { workspace = true }
smallvec = { workspace = true }

[features]
# Every lava feature checked at runtime, so the tests cover what the device has.
default = ["lava/default"]

[build-dependencies]
lava-build-slang = { path = "../lava-build-slang" }

[[test]]
name = "gpu_window"
harness = false

# Recording generated passes into real command buffers, headless.
[[bench]]
name = "recording"
harness = false
