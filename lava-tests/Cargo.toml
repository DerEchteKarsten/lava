[package]
name = "lava-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
lava = { path = "../lava", default-features = false }
glam = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
winit = "0.30"
raw-window-handle = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
png = { workspace = true }
smallvec = { workspace = true }

[build-dependencies]
lava-build-slang = { path = "../lava-build-slang" }

[features]
default = ["profiling"]
# lava's feature, so `--no-default-features` tests lava without it.
profiling = []

[[test]]
name = "gpu_window"
harness = false

# BindingOutput layout microbenchmark; no GPU.
[[bench]]
name = "bindings"
harness = false

# Recording generated passes into real command buffers, headless.
[[bench]]
name = "recording"
harness = false
