[package]
name = "lava-build-slang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "lava's Slang frontend: compiles an application's Slang passes in its build script and generates their typed lava bindings"
readme = "README.md"
keywords = ["vulkan", "slang", "shader", "codegen", "lava"]
categories = ["development-tools::build-utils", "graphics", "rendering::graphics-api"]
include = ["build.rs", "src/**", "slang/**", "README.md", "LICENSE-*"]

[dependencies]
shader-slang.workspace = true
# Only for `src/reflect.rs`, which checks the reflection results 0.1.0 doesn't.
shader-slang-sys.workspace = true
# Without its defaults: the application picks lava's features (cargo would add every default).
lava = { version = "0.1.0", path = "../lava", optional = true, default-features = false }
notify = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# For the test that compares the SPIR-V capability tables (`src/features.rs`).
lava = { path = "../lava" }

[features]
# Recompiles changed passes while the application runs (a debugging aid, `src/hot_reload.rs`),
# for its normal dependency; the build script's stays free of lava.
hot-reload = ["dep:lava", "dep:notify", "dep:tracing"]
