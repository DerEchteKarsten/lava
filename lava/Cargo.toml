[package]
name = "lava"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
glam = {workspace = true}
bytemuck = {workspace = true}
tracing = {workspace = true}
ash = {workspace = true}
ash-window = {workspace = true}
gpu-allocator = {workspace = true}
raw-window-handle = {workspace = true}
lava-macros = { version = "0.1.0", path = "../lava-macros" }
smallvec.workspace = true
notify = "8.2.0"
shader-slang = { git = "https://github.com/FloatyMonkey/slang-rs" }

[build-dependencies]
shader-slang = { git = "https://github.com/FloatyMonkey/slang-rs" }

[dev-dependencies]
# Enables the test passes for lava's own tests only.
lava = { path = ".", features = ["test-passes"] }
winit = "0.30"
tracing-subscriber = { workspace = true }
png = "0.18"

[features]
default = []
# Also compile the passes in `tests/shaders` (bindings then go to OUT_DIR).
test-passes = []
# hot-reload = ["notify"]

[[test]]
name = "gpu_window"
harness = false
