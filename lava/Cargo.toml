[package]
name = "lava"
version.workspace = true
edition.workspace = true
build = "build.rs"
# Hands the `profiling` feature to lava-build-slang in the application's build script
# (`DEP_LAVA_PROFILING`).
links = "lava"

[dependencies]
glam = {workspace = true}
bytemuck = {workspace = true}
tracing = {workspace = true}
ash = {workspace = true}
ash-window = {workspace = true}
gpu-allocator = {workspace = true}
raw-window-handle = {workspace = true}
lava-macros = { version = "0.1.0", path = "../lava-macros" }
smallvec.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true }

[features]
default = ["profiling"]
# GPU timestamps, pipeline statistics and shader clocks (`PROFILING` in the frontend's
# `profile.slang`).
profiling = []
