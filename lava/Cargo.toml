[package]
name = "lava"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vulkan for Rust with bindless resources, automatic barriers and typed pass bindings generated from shaders"
readme = "../README.md"
keywords = ["vulkan", "graphics", "gpu", "bindless", "rendering"]
categories = ["graphics", "rendering::graphics-api", "game-development"]
include = ["src/**", "LICENSE-*"]

[dependencies]
glam = {workspace = true}
bytemuck = {workspace = true}
tracing = {workspace = true}
ash = {workspace = true}
ash-window = {workspace = true}
gpu-allocator = {workspace = true}
raw-window-handle = {workspace = true}
lava-macros = { version = "0.1.0", path = "../lava-macros" }
smallvec.workspace = true
hashbrown.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true }

[features]
default = []
