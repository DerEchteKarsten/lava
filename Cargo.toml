[workspace]
resolver = "3"
members = ["lava", "lava-build-slang", "lava-macros", "lava-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["Christian Keitz"]
repository = "https://github.com/DerEchteKarsten/lava"

[workspace.dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = { version = "0.32", features = ["bytemuck", "mint"] }
ash = "0.38.0"
ash-window = "0.13.0"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
shader-slang = { git = "https://github.com/FloatyMonkey/slang-rs", rev = "f9c9eece467aa84f3be1aa1137426f59591095fc" }
raw-window-handle = "0.6.2"
smallvec = { version = "1.15.1", features = ["union", "const_generics"] }
hashbrown = "0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
notify = "8.2.0"
png = "0.18"
