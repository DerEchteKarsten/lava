[package]
name = "lava"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
ash = "0.38.0"
ash-window = "0.13.0"
async-std = "1.13.2"
bitflags = "2.10.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
derivative = "2.2.0"
glam = { version = "0.30.5", features = ["bytemuck"] }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
json = "0.12.4"
log = "0.4.28"
presser = "0.3.1"
raw-window-handle = "0.6.2"
tracy-client = {version = "0.18.4", optional = true}
winit = "0.30.12"

[features]
default = []
trace = ["tracy-client"]
