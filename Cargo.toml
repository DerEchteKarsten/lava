[workspace]
resolver = "3"
members = ["lava", "lava-bench", "lava-build-slang", "lava-macros", "lava-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["Christian Keitz"]
repository = "https://github.com/DerEchteKarsten/lava"

[workspace.dependencies]
bytemuck = { version = "1.24.0", features = ["derive", "min_const_generics"] }
glam = { version = "0.32", features = ["bytemuck"] }
ash = "0.38.0"
ash-window = "0.13.0"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
shader-slang = "0.1.0"
shader-slang-sys = "0.1.0"
raw-window-handle = "0.6.2"
smallvec = { version = "1.15.1", features = ["union", "const_generics"] }
hashbrown = "0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
notify = "8.2.0"
png = "0.18"
quote = "1.0.47"
syn = { version = "3.0.4", features = ["full"] }
